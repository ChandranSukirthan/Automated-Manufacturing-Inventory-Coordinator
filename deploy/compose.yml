# Local container packaging. Configure TLS/reverse-proxy settings before hosting.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: inventory_coordinator
      POSTGRES_USER: amic
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U amic -d inventory_coordinator"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: {context: .., dockerfile: deploy/backend.Dockerfile}
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Database=inventory_coordinator;Username=amic;Password=${DB_PASSWORD}
      DB_HOST: postgres
      DB_USER: amic
      DB_NAME: inventory_coordinator
      AgentServer__BaseUrl: http://ai:8000
      Database__SeedDemoData: 'false'
    ports: ['127.0.0.1:5070:8080']
    depends_on:
      postgres: {condition: service_healthy}
  ai:
    build: {context: .., dockerfile: deploy/ai.Dockerfile}
    env_file: .env
    environment:
      BACKEND_HOST: http://backend:8080
      DB_HOST: postgres
      DB_USER: amic
      DB_NAME: inventory_coordinator
      DEMO_MODE: 'false'
    volumes: [workflow-data:/data]
    depends_on:
      postgres: {condition: service_healthy}
  frontend:
    build: {context: .., dockerfile: deploy/frontend.Dockerfile}
    ports: ['127.0.0.1:8081:80']
    depends_on: [backend]
volumes:
  postgres-data:
  workflow-data:
