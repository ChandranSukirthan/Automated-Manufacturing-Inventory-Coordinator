# Keep Gradle within the memory available on GitHub's hosted Windows runner.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# GitHub's Windows runner places Pub packages on C: and this project on D:.
# Kotlin incremental cache paths cannot span those drives, so turn it off for
# reliable CI builds. This only affects build speed, not the generated APK.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
